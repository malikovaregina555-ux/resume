<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!-- Генератор текстур для палитры «Нормы»: 4 холста по 800×800 в ряд, скриншот режется на 4 файла -->
<style>html,body{margin:0;background:#000}canvas{display:block;float:left}</style>
</head><body>
<canvas id="graphite" width="800" height="800"></canvas>
<canvas id="silver" width="800" height="800"></canvas>
<canvas id="fur" width="800" height="800"></canvas>
<canvas id="matte" width="800" height="800"></canvas>
<script>
const S = 800;

// детерминированный шум, чтобы перегенерация давала ту же картинку
let seed = 7;
function rand() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

function makeNoise(gridSize) {
  const g = new Float32Array(gridSize * gridSize);
  for (let i = 0; i < g.length; i++) g[i] = rand();
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const sx = xf * xf * (3 - 2 * xf), sy = yf * yf * (3 - 2 * yf);
    const at = (a, b) => g[((b % gridSize + gridSize) % gridSize) * gridSize + ((a % gridSize + gridSize) % gridSize)];
    const a = at(xi, yi), b = at(xi + 1, yi), c = at(xi, yi + 1), d = at(xi + 1, yi + 1);
    return (a + (b - a) * sx) + ((c + (d - c) * sx) - (a + (b - a) * sx)) * sy;
  };
}
const n1 = makeNoise(256), n2 = makeNoise(256), n3 = makeNoise(256);

function fbm(noise, x, y, oct, lac = 2, gain = 0.5) {
  let v = 0, amp = 1, f = 1, sum = 0;
  for (let i = 0; i < oct; i++) { v += noise(x * f, y * f) * amp; sum += amp; amp *= gain; f *= lac; }
  return v / sum;
}
function ridged(noise, x, y, oct) {
  let v = 0, amp = 1, f = 1, sum = 0;
  for (let i = 0; i < oct; i++) { const r = 1 - Math.abs(noise(x * f, y * f) * 2 - 1); v += r * r * amp; sum += amp; amp *= 0.5; f *= 2; }
  return v / sum;
}
const clamp = (v, a = 0, b = 255) => Math.max(a, Math.min(b, v));

function paint(id, fn) {
  const ctx = document.getElementById(id).getContext('2d');
  const img = ctx.createImageData(S, S);
  const d = img.data;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const [r, g, b] = fn(x, y);
    const k = (y * S + x) * 4;
    d[k] = clamp(r); d[k + 1] = clamp(g); d[k + 2] = clamp(b); d[k + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return ctx;
}

// 1. графит / уголь: рельеф с трещинами, свет сверху слева
(function graphite() {
  // рельеф: крупные сколы (террасы) + рваные края + мелкая крошка
  const H = new Float32Array(S * S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const u = x / 220, v = y / 220;
    const warp = fbm(n2, u * 1.3, v * 1.3, 4) * 0.6;
    const big = fbm(n1, u + warp, v * 0.7 + warp, 6);
    const terraces = Math.floor(big * 9) / 9 + (big * 9 % 1) * 0.04;
    H[y * S + x] = terraces * 0.9 + ridged(n3, u * 2.4 + warp, v * 1.8, 5) * 0.25 + fbm(n2, x / 3.5, y / 3.5, 3) * 0.12;
  }
  paint('graphite', (x, y) => {
    const i = y * S + x;
    const dx = H[i] - H[y * S + Math.min(S - 1, x + 1)];
    const dy = H[i] - H[Math.min(S - 1, y + 1) * S + x];
    const shade = clamp((dx * 0.75 + dy * 0.65) * 1500, -60, 120);
    let v = 46 + H[i] * 34 + shade + (rand() - 0.5) * 14;
    // угольные блёстки
    if (rand() < 0.004) v += 70 + rand() * 80;
    return [v, v, v + 3];
  });
})();

// 2. светлый глянцевый металл: плавные изогнутые отражения, как у полированного хрома, с резкими бликами
(function silver() {
  const ang = -0.35, ca = Math.cos(ang), sa = Math.sin(ang);
  paint('silver', (x, y) => {
    const warp = (fbm(n1, x / 420, y / 420, 3) - 0.5) * 260 + (fbm(n2, x / 160, y / 160, 2) - 0.5) * 40;
    const t = (y * ca + x * sa + warp) / 800;
    // мягкие полосы отражения окружения
    // одна волна отражения сверху: тёмный рефлекс и яркий блик, ниже металл спокойный, без второй волны
    let v = 0.62 + 0.1 * Math.sin(t * 6 + 0.6);
    v += 0.42 * Math.exp(-((t - 0.22) ** 2) / 0.0009);
    v -= 0.35 * Math.exp(-((t - 0.1) ** 2) / 0.0018) + 0.18 * Math.exp(-((t - 0.32) ** 2) / 0.003);
    const l = clamp(118 + v * 135 + (rand() - 0.5) * 2);
    return [l + 2, l + 1, l - 3];
  });
})();

// 3. неоновый мех: тысячи тонких ворсинок, расходящихся из нескольких пучков
(function fur() {
  const ctx = document.getElementById('fur').getContext('2d');
  // ворс лежит по полю направлений из шума: волнистые пряди, тёмный подшёрсток, светлые кончики
  ctx.fillStyle = '#4d6a04';
  ctx.fillRect(0, 0, S, S);
  ctx.lineCap = 'round';
  const flow = (x, y) => Math.PI * 0.5 + (fbm(n1, x / 260, y / 260, 3) - 0.5) * 3.2;
  const layers = [
    { count: 22000, len: [30, 60], light: [22, 36], alpha: [0.5, 0.9], width: [0.8, 1.8] },
    { count: 26000, len: [40, 80], light: [40, 56], alpha: [0.45, 0.85], width: [0.6, 1.3] },
    { count: 16000, len: [45, 90], light: [60, 78], alpha: [0.35, 0.8], width: [0.4, 1] }
  ];
  const lerp = (r) => r[0] + rand() * (r[1] - r[0]);
  for (const layer of layers) {
    for (let i = 0; i < layer.count; i++) {
      let x = rand() * (S + 120) - 60, y = rand() * (S + 120) - 100;
      const len = lerp(layer.len), steps = 6, seg = len / steps;
      ctx.strokeStyle = `hsla(${71 + rand() * 7}, ${90 + rand() * 10}%, ${lerp(layer.light)}%, ${lerp(layer.alpha)})`;
      ctx.lineWidth = lerp(layer.width);
      ctx.beginPath();
      ctx.moveTo(x, y);
      const jitter = (rand() - 0.5) * 0.6;
      for (let s = 0; s < steps; s++) {
        const a = flow(x, y) + jitter;
        x += Math.cos(a) * seg; y += Math.sin(a) * seg;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }
  // мягкий блик сверху, как от света на ворсе
  ctx.globalCompositeOperation = 'screen';
  const glow = ctx.createRadialGradient(360, 120, 10, 360, 120, 460);
  glow.addColorStop(0, 'rgba(235,255,150,0.45)');
  glow.addColorStop(1, 'rgba(235,255,150,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, S, S);
})();

// 4. матовый металл: мелкое зерно, едва заметная шлифовка и пятна
(function matte() {
  paint('matte', (x, y) => {
    // пескоструйный металл: плотное мелкое зерно, крупные мягкие пятна, без полос
    const blot = fbm(n3, x / 120, y / 120, 5) - 0.5;
    const fine = fbm(n2, x / 2.5, y / 2.5, 2) - 0.5;
    const dent = ridged(n1, x / 40, y / 40, 3);
    const light = Math.exp(-((x - 300) ** 2 + (y + 80) ** 2) / (2 * 380 * 380));
    const g = (rand() - 0.5) * 22;
    const k = blot * 34 + fine * 24 + (dent - 0.5) * 14 + light * 40 + g;
    return [92 + k, 100 + k, 128 + k * 1.05];
  });
})();
</script>
</body></html>
