<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Норма — экраны нижнего меню</title>
<!-- Черновик для кейса «Норма»: вкладки «Налоги», «Счета», «История» к новому главному экрану.
     ?screen=tax | invoices | history — показать один телефон на прозрачном фоне (для экспорта PNG 413×872) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<style>
  :root {
    --canvas: #f2f2f0;
    --ink: #181818;
    --screen: #111111;
    --surface: #1c1c1c;
    --text: #ffffff;
    --muted: #8c8c8c;
    --lime: #d4fc46;
    --green: #4cb56a;
    --coral: #ff7b67;
    --slate: #636a83;
    --cream: #e7e6df;
    --font: "Inter", Arial, sans-serif;
    --num: "Unbounded", "Inter", Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--canvas);
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }
  p, h1, h2, dl, dd, ol, ul { margin: 0; padding: 0; }
  ol, ul { list-style: none; }
  svg { display: block; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* доска с тремя телефонами */
  .board { display: flex; justify-content: center; gap: 56px; padding: 64px 56px 72px; }
  .shot { display: grid; justify-items: center; gap: 24px; margin: 0; }
  .shot figcaption { max-width: 340px; color: var(--ink); font-size: 15px; line-height: 1.35; text-align: center; opacity: 0.8; }
  .shot figcaption b { display: block; margin-bottom: 4px; font-size: 18px; font-weight: 600; opacity: 1; }

  /* режим одного экрана для экспорта */
  .single { background: transparent; }
  .single .board { justify-content: flex-start; padding: 0; gap: 0; }
  .single figcaption { display: none; }
  .single .phone { box-shadow: inset 0 0 0 1.5px #2e2e2e, inset 0 0 0 4px #0c0c0c; }

  /* телефон */
  .phone {
    width: 413px; height: 872px; padding: 10px;
    border-radius: 64px;
    background: #050505;
    box-shadow: inset 0 0 0 1.5px #2e2e2e, inset 0 0 0 4px #0c0c0c, 0 44px 60px -38px rgba(0, 0, 0, 0.6);
  }
  .screen { position: relative; width: 393px; height: 852px; overflow: hidden; border-radius: 54px; background: var(--screen); }
  .island { position: absolute; z-index: 6; top: 11px; left: 50%; width: 124px; height: 36px; margin-left: -62px; border-radius: 20px; background: #000; }
  .home-bar { position: absolute; z-index: 6; bottom: 9px; left: 50%; width: 136px; height: 5px; margin-left: -68px; border-radius: 3px; background: #dcdcdc; }
  .screen::after {
    content: ""; position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; height: 200px;
    background: linear-gradient(to bottom, rgba(17, 17, 17, 0), rgba(17, 17, 17, 0.9) 55%, #111 82%);
    pointer-events: none;
  }
  .content { padding: 62px 20px 0; }

  /* нижнее меню */
  .nav {
    position: absolute; z-index: 4; left: 50%; bottom: 30px; transform: translateX(-50%);
    display: flex; gap: 4px; padding: 5px;
    border-radius: 32px;
    background: #262626;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.05), 0 14px 32px rgba(0, 0, 0, 0.55);
  }
  .nav span { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; color: #a3a3a3; }
  .nav span.is-active { background: var(--lime); color: #111; }
  .nav svg { width: 26px; height: 26px; }

  /* шапка вкладки */
  .top { display: flex; align-items: center; justify-content: space-between; height: 48px; margin-bottom: 16px; }
  .top h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
  .tools { display: flex; gap: 18px; color: #cfcfcf; }
  .tools svg { width: 28px; height: 28px; }

  /* главная карточка — тот же рецепт, что у карточки баланса */
  .card {
    position: relative; overflow: hidden;
    padding: 18px 18px 20px;
    border-radius: 28px;
    background:
      radial-gradient(70% 55% at 96% 0%, rgba(134, 150, 166, 0.55), rgba(134, 150, 166, 0) 72%),
      radial-gradient(110% 58% at 58% 114%, rgba(214, 252, 70, 0.96), rgba(186, 226, 58, 0.6) 34%, rgba(110, 140, 36, 0.16) 62%, rgba(0, 0, 0, 0) 80%),
      #161616;
  }
  .card-wrap { position: relative; }
  .card-wrap::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: calc(100% + 8px); width: 40px;
    border-radius: 28px;
    background: radial-gradient(140% 55% at 0% 112%, rgba(214, 252, 70, 0.55), rgba(0, 0, 0, 0) 70%), #1a1a1a;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; height: 30px; padding: 0 12px; border-radius: 15px; background: rgba(255, 255, 255, 0.1); color: #f1f1f1; font-size: 14px; font-weight: 500; }
  .chip--lime { background: var(--lime); color: #111; }
  .label { margin-top: 18px; color: rgba(255, 255, 255, 0.6); font-size: 14px; }
  .amount { margin-top: 6px; font-family: var(--num); font-size: 42px; font-weight: 600; line-height: 1; letter-spacing: -0.02em; white-space: nowrap; }
  .note { margin-top: 10px; color: rgba(255, 255, 255, 0.62); font-size: 14px; }
  .note em { color: var(--lime); font-style: normal; font-weight: 500; }

  /* налоги */
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 20px; }
  .split div { padding: 12px 14px; border-radius: 16px; background: rgba(10, 10, 10, 0.42); backdrop-filter: blur(10px); }
  .split dt { color: rgba(255, 255, 255, 0.62); font-size: 12.5px; }
  .split dd { margin-top: 6px; font-family: var(--num); font-size: 16px; font-weight: 600; white-space: nowrap; }
  .pay { display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; margin-top: 14px; border-radius: 26px; background: #111; color: #fff; font-size: 16px; font-weight: 600; }
  .pay svg { width: 20px; height: 20px; color: var(--lime); }

  .panel { margin-top: 12px; padding: 16px; border-radius: 22px; background: var(--surface); }
  .limit__head { display: flex; justify-content: space-between; font-size: 14px; }
  .limit__head b { font-weight: 600; }
  .limit__head span { color: var(--lime); font-weight: 600; }
  .bar { height: 8px; margin: 12px 0 10px; overflow: hidden; border-radius: 4px; background: rgba(255, 255, 255, 0.1); }
  .bar i { display: block; width: 49%; height: 100%; border-radius: 4px; background: var(--lime); }
  .limit__foot { display: flex; justify-content: space-between; color: var(--muted); font-size: 12.5px; }
  .limit__foot span:first-child { color: #fff; }

  .setting { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 12px; margin-top: 10px; padding: 12px 14px 12px 12px; border-radius: 22px; background: var(--surface); }
  .setting .ico { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: rgba(212, 252, 70, 0.12); color: var(--lime); }
  .setting .ico svg { width: 20px; height: 20px; }
  .setting b { display: block; font-size: 15px; font-weight: 500; }
  .setting small { display: block; margin-top: 3px; color: var(--muted); font-size: 12.5px; }
  .switch { position: relative; width: 46px; height: 28px; border-radius: 14px; background: var(--lime); }
  .switch::after { content: ""; position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; background: #111; }

  /* списки */
  .sec { display: flex; align-items: baseline; justify-content: space-between; margin: 22px 0 6px; }
  .sec h2 { font-size: 18px; font-weight: 600; }
  .sec span { color: var(--muted); font-size: 12px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; }
  .sec span.sec__sum { color: #fff; font-size: 15px; letter-spacing: 0; text-transform: none; font-weight: 600; }
  .day { margin: 14px 0 2px; color: var(--muted); font-size: 13px; }
  .row { display: grid; grid-template-columns: 42px 1fr auto; align-items: center; gap: 12px; padding: 8px 0; }
  .ava { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; background: #2a2a2a; color: #fff; font-size: 14px; font-weight: 600; }
  .ava svg { width: 20px; height: 20px; }
  .ava--coffee { background: #6b5a52; }
  .ava--grey { background: linear-gradient(145deg, #8f8b84, #55524e); }
  .ava--dark { background: linear-gradient(145deg, #6a6a6a, #343434); }
  .ava--slate { background: var(--slate); }
  .ava--cream { background: var(--cream); color: #1b1b1b; }
  .ava--ok { background: rgba(76, 181, 106, 0.14); color: var(--green); }
  .row b { display: block; font-size: 15.5px; font-weight: 500; }
  .row small { display: block; margin-top: 3px; color: var(--muted); font-size: 12.5px; }
  .sum { font-size: 15.5px; font-weight: 600; text-align: right; white-space: nowrap; }
  .sum--in { color: var(--green); }
  .sum-col { text-align: right; }
  .tag { display: inline-block; margin-top: 5px; padding: 3px 8px; border-radius: 10px; background: rgba(255, 255, 255, 0.08); color: #cfcfcf; font-size: 11.5px; font-weight: 500; }
  .tag--late { background: rgba(255, 123, 103, 0.14); color: var(--coral); }

  /* счета */
  .create { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .create span { display: grid; gap: 12px; padding: 14px; border-radius: 20px; background: var(--surface); font-size: 14px; font-weight: 500; }
  .create svg { width: 24px; height: 24px; color: var(--lime); }
  .track { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 20px; }
  .track::before { content: ""; position: absolute; top: 10px; left: 16.66%; right: 16.66%; height: 2px; background: linear-gradient(to right, var(--lime) 0 50%, rgba(255, 255, 255, 0.2) 50%); }
  .track li { display: grid; justify-items: center; gap: 4px; text-align: center; }
  .track i { position: relative; z-index: 1; display: grid; place-items: center; width: 22px; height: 22px; margin-bottom: 4px; border-radius: 50%; background: var(--lime); color: #111; }
  .track i svg { width: 13px; height: 13px; stroke-width: 2.6; }
  .track .now i { background: #1c1c1c; box-shadow: 0 0 0 2px var(--lime), 0 0 0 7px rgba(212, 252, 70, 0.16); }
  .track b { font-size: 12.5px; font-weight: 500; }
  .track small { color: rgba(255, 255, 255, 0.55); font-size: 11.5px; }
  .actions { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 22px; }
  .actions span { display: grid; justify-items: center; gap: 8px; color: rgba(255, 255, 255, 0.66); font-size: 13px; font-weight: 500; }
  .actions i { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 50%; background: var(--lime); color: #111; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.08); }
  .actions i.is-glass { background: rgba(255, 255, 255, 0.2); color: #fff; }
  .actions svg { width: 22px; height: 22px; }

  /* история */
  .month { display: inline-flex; align-items: center; gap: 6px; height: 34px; margin-bottom: 12px; padding: 0 10px 0 14px; border-radius: 17px; background: var(--surface); font-size: 14px; font-weight: 500; }
  .month svg { width: 18px; height: 18px; color: var(--muted); }
  .card--stats {
    padding-bottom: 14px;
    background:
      radial-gradient(70% 60% at 100% 0%, rgba(134, 150, 166, 0.5), rgba(134, 150, 166, 0) 72%),
      radial-gradient(70% 70% at 0% 0%, rgba(212, 252, 70, 0.16), rgba(212, 252, 70, 0) 70%),
      #171717;
  }
  .flows { display: flex; align-items: flex-end; justify-content: space-between; }
  .flows span { color: rgba(255, 255, 255, 0.6); font-size: 13px; }
  .flows b { display: block; margin-top: 6px; font-family: var(--num); font-size: 24px; font-weight: 600; letter-spacing: -0.02em; white-space: nowrap; }
  .flows .in b { color: var(--lime); }
  .flows .out { text-align: right; }
  .flows .out b { font-family: var(--font); font-size: 17px; letter-spacing: 0; }
  .bars { display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
  .bars div { display: grid; justify-items: center; gap: 8px; }
  .bars .pair { display: flex; align-items: flex-end; gap: 4px; height: 86px; }
  .bars i { width: 14px; border-radius: 5px 5px 3px 3px; background: var(--lime); }
  .bars i + i { background: rgba(255, 255, 255, 0.3); }
  .bars small { color: rgba(255, 255, 255, 0.55); font-size: 11.5px; }
  .filters { display: flex; gap: 6px; margin-top: 16px; }
  .filters span { display: inline-flex; flex: none; align-items: center; height: 34px; padding: 0 12px; border-radius: 17px; background: rgba(255, 255, 255, 0.08); color: #d6d6d6; font-size: 14px; font-weight: 500; }
  .filters .is-active { background: #fff; color: #111; }
</style>
</head>

<main class="board">

  <!-- 1. Налоги -->
  <figure class="shot" data-screen="tax">
    <div class="phone"><div class="screen">
      <div class="island"></div>
      <div class="content">
        <header class="top">
          <h1>Налоги</h1>
          <div class="tools"><svg><use href="#i-info"/></svg></div>
        </header>

        <section class="card">
          <div class="chips"><span class="chip">НПД</span><span class="chip">сентябрь</span><span class="chip chip--lime">до 28 октября</span></div>
          <p class="label">К оплате</p>
          <p class="amount">7 176 ₽</p>
          <p class="note">с дохода 152 400 ₽ за месяц</p>
          <dl class="split">
            <div><dt>Физлица · 4%</dt><dd>3 936 ₽</dd></div>
            <div><dt>Юрлица · 6%</dt><dd>3 240 ₽</dd></div>
          </dl>
          <div class="pay">Оплатить через СБП <svg><use href="#i-sbp"/></svg></div>
        </section>

        <section class="panel">
          <div class="limit__head"><b>Лимит дохода на 2026</b><span>49%</span></div>
          <div class="bar"><i></i></div>
          <div class="limit__foot"><span>1 184 000 ₽</span><span>из 2 400 000 ₽</span></div>
        </section>

        <section class="setting">
          <span class="ico"><svg><use href="#i-refresh"/></svg></span>
          <div><b>Автоплатёж</b><small>27-го числа с карты ****3490</small></div>
          <span class="switch" aria-label="включён"></span>
        </section>

        <div class="sec"><h2>Начисления</h2><span>2026 ▾</span></div>
        <div class="row"><span class="ava ava--ok"><svg><use href="#i-check"/></svg></span><div><b>Август</b><small>Оплачен 27 сентября</small></div><span class="sum">6 480 ₽</span></div>
        <div class="row"><span class="ava ava--ok"><svg><use href="#i-check"/></svg></span><div><b>Июль</b><small>Оплачен 27 августа</small></div><span class="sum">5 912 ₽</span></div>
        <div class="row"><span class="ava ava--ok"><svg><use href="#i-check"/></svg></span><div><b>Июнь</b><small>Оплачен 27 июля</small></div><span class="sum">6 104 ₽</span></div>
      </div>
      <nav class="nav"><span><svg><use href="#i-home"/></svg></span><span class="is-active"><svg><use href="#i-coins"/></svg></span><span><svg><use href="#i-refresh"/></svg></span><span><svg><use href="#i-clock"/></svg></span></nav>

  </figure>

  <!-- 2. Счета -->
  <figure class="shot" data-screen="invoices">
    <div class="phone"><div class="screen">
      <div class="island"></div>
      <div class="content">
        <header class="top">
          <h1>Счета</h1>
          <div class="tools"><svg><use href="#i-search"/></svg></div>
        </header>

        <div class="create">
          <span><svg><use href="#i-doc"/></svg>Счёт</span>

          <span><svg><use href="#i-qr"/></svg>QR-код</span>

            <p class="amount">85 000 ₽</p>
            <p class="note">к получению <em>79 900 ₽</em> · налог 6% учтён</p>
            <ol class="track">
              <li><i><svg><use href="#i-check"/></svg></i><b>Отправлен</b><small>10:12</small></li>
              <li><i><svg><use href="#i-check"/></svg></i><b>Открыт</b><small>10:40</small></li>
              <li class="now"><i></i><b>Оплата</b><small>ждём</small></li>
            </ol>
            <div class="actions">
              <span><i class="is-glass"><svg><use href="#i-bell"/></svg></i>Напомнить</span>
              <span><i><svg><use href="#i-share"/></svg></i>Поделиться</span>
              <span><i><svg><use href="#i-qr"/></svg></i>QR-код</span>
            </div>
          </section>
        </div>
